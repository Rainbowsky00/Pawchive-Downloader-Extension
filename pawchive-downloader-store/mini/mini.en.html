<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pawchive Download Monitor</title>
  <link rel="stylesheet" href="mini.css">
</head>
<body>
  <header class="head">
    <span class="logo">⇣</span>
    <div class="head-txt">
      <div class="title">Pawchive Download Monitor</div>
      <div class="subtitle" id="statusLine">Connecting…</div>
    </div>
  </header>

  <section class="counts" id="counts"></section>

  <div id="pausedBox" class="paused hidden">
    <div id="pausedText"></div>
    <button id="btnResume" class="primary">▶ Resume</button>
  </div>

  <div class="btns">
    <button id="btnPause">⏸ Pause</button>
    <button id="btnResume2" class="hidden">▶ Resume</button>
    <button id="btnStop">■ Stop</button>
  </div>
  <div class="btns">
    <button id="btnReset" class="ghost">Clear download records</button>
  </div>

  <section class="sec" id="activeSec">
    <div class="sec-title">Downloading (<span id="activeCount">0</span>)</div>
    <div id="active" class="items"></div>
  </section>

  <section class="sec">
    <div class="sec-title">Next up (first 15 of <span id="queueCount">0</span>)</div>
    <div id="pending" class="items"></div>
  </section>

  <section class="sec">
    <div class="sec-title">Recent completed / failed (deduplicated)</div>
    <div id="items" class="items"></div>
  </section>

  <section class="sec">
    <div class="sec-title">Diagnostics (actual plugin actions)</div>
    <div id="diag" class="items diag"></div>
  </section>

  <section class="sec">
    <div class="sec-title">Failures (<span id="failCount">0</span>)</div>
    <div id="fails" class="items fails"></div>
  </section>

  <script src="mini.en.js"></script>
</body>
</html>
