<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Pawchive 下载监控</title>
  <link rel="stylesheet" href="mini.css">
</head>
<body>
  <header class="head">
    <span class="logo">⇣</span>
    <div class="head-txt">
      <div class="title">Pawchive 下载监控</div>
      <div class="subtitle" id="statusLine">正在连接…</div>
    </div>
  </header>

  <section class="counts" id="counts"></section>

  <div id="pausedBox" class="paused hidden">
    <div id="pausedText"></div>
    <button id="btnResume" class="primary">▶ 继续下载</button>
  </div>

  <div class="btns">
    <button id="btnPause">⏸ 暂停</button>
    <button id="btnResume2" class="hidden">▶ 继续</button>
    <button id="btnStop">■ 结束下载</button>
  </div>
  <div class="btns">
    <button id="btnReset" class="ghost">清空下载记录</button>
  </div>

  <section class="sec" id="activeSec">
    <div class="sec-title">正在下载 (<span id="activeCount">0</span>)</div>
    <div id="active" class="items"></div>
  </section>

  <section class="sec">
    <div class="sec-title">待下载（接下来 15 个，共 <span id="queueCount">0</span> 个）</div>
    <div id="pending" class="items"></div>
  </section>

  <section class="sec">
    <div class="sec-title">最近完成/失败（按文件去重）</div>
    <div id="items" class="items"></div>
  </section>

  <section class="sec">
    <div class="sec-title">诊断（插件实际执行记录）</div>
    <div id="diag" class="items diag"></div>
  </section>

  <section class="sec">
    <div class="sec-title">失败明细 (<span id="failCount">0</span>)</div>
    <div id="fails" class="items fails"></div>
  </section>

  <script src="mini.zh.js"></script>
</body>
</html>
